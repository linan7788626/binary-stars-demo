<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双星纪元 Binary Era — 双星演化实验室</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="menu-screen" class="screen">
  <div class="menu-inner">
    <h1 class="game-title">双星纪元 <span>Binary Era</span></h1>
    <p class="game-sub">亲手演化一对恒星：从主序烟火到引力波长歌<br><small>知识内核：本科《恒星物理》双星演化 · 参考：韩占文《恒星物理的发展》(《物理》2025)</small></p>
    <div id="level-list" class="level-list"></div>
    <div class="menu-actions">
      <button id="btn-free" class="btn primary">☆ 自由模式</button>
      <button id="btn-gallery" class="btn">📖 知识图鉴</button>
    </div>
  </div>
</div>

<div id="game-screen" class="screen hidden">
  <header class="topbar">
    <button id="btn-back" class="btn small">← 主菜单</button>
    <div class="level-info">
      <span id="hud-level-name">关卡</span>
      <div id="hud-goals" class="goals"></div>
    </div>
    <span id="hud-badge" class="badge">分离 D</span>
    <label class="switch" title="解锁知识卡时是否暂停并弹出卡片"><input type="checkbox" id="opt-cards">📖 卡片弹窗</label>
    <label class="switch" title="遇到关键决策时是否暂停等待选择（关闭则自动按默认策略决策）"><input type="checkbox" id="opt-choices">⚙ 决策弹窗</label>
    <button id="btn-gallery2" class="btn small">📖 图鉴</button>
  </header>

  <main class="game-grid">
    <section class="panel orbit-panel">
      <canvas id="orbit-canvas" width="640" height="480"></canvas>
    </section>
    <aside class="side-col">
      <div id="star-cards" class="star-cards"></div>
      <div class="panel orbit-params">
        <h3>轨道参数</h3>
        <div id="orbit-params-body" class="kv"></div>
        <div class="inc-row">
          <span>观测倾角 i</span>
          <input type="range" id="inc-slider" min="0" max="90" step="1" value="80" title="拖动倾角,发现食双星">
          <output id="inc-out">80°</output>
        </div>
        <div id="ecl-hint" class="ecl-hint"></div>
      </div>
      <div class="panel log-panel">
        <h3>事件日志</h3>
        <div id="event-log" class="event-log"></div>
      </div>
    </aside>
    <section class="bottom-charts">
      <div class="panel"><canvas id="hrd-canvas" width="460" height="300"></canvas></div>
      <div class="panel"><canvas id="lc-canvas" width="380" height="300"></canvas></div>
      <div class="panel stage-panel">
        <h3>演化阶段</h3>
        <div id="stage-track" class="stage-track"></div>
      </div>
    </section>
  </main>

  <footer class="timebar">
    <span id="time-display" class="time-display">t = 0</span>
    <button id="btn-play" class="btn primary">▶ 开始演化</button>
    <div class="speed-group" id="speed-group">
      <button class="btn small speed" data-v="1">1×</button>
      <button class="btn small speed" data-v="10">10×</button>
      <button class="btn small speed" data-v="100">100×</button>
      <button class="btn small speed" data-v="1000">1000×</button>
    </div>
    <div class="age-wrap" title="系统年龄相对宇宙年龄(13.8 Gyr)的进度">
      <div class="age-bar" id="age-bar"><div id="age-fill"></div></div>
      <div class="age-cap"><span>0</span><span>宇宙年龄 13.8 Gyr</span></div>
    </div>
    <button id="btn-restart" class="btn small">↺ 重开本关</button>
    <span id="hint-text" class="hint-text"></span>
  </footer>
</div>

<div id="modal-choice" class="modal hidden">
  <div class="modal-box">
    <h2 id="choice-title"></h2>
    <p id="choice-desc"></p>
    <div id="choice-meta" class="choice-meta"></div>
    <div id="choice-options" class="choice-options"></div>
  </div>
</div>

<div id="modal-card" class="modal hidden">
  <div class="modal-box card-box">
    <div id="card-icon" class="card-icon"></div>
    <h2 id="card-title"></h2>
    <p id="card-simple" class="card-simple"></p>
    <p id="card-body"></p>
    <p id="card-ref" class="card-ref"></p>
    <button id="card-close" class="btn primary">继续演化 →</button>
  </div>
</div>

<div id="modal-end" class="modal hidden">
  <div class="modal-box">
    <h2 id="end-title"></h2>
    <p id="end-desc"></p>
    <div id="end-goals" class="end-goals"></div>
    <div class="modal-actions">
      <button id="end-restart" class="btn primary">↺ 再演一次</button>
      <button id="end-menu" class="btn">返回主菜单</button>
    </div>
  </div>
</div>

<div id="modal-gallery" class="modal hidden">
  <div class="modal-box gallery-box">
    <h2>📖 知识图鉴</h2>
    <p class="gallery-sub">随演化事件解锁 · 点击卡片展开</p>
    <div id="gallery-list" class="gallery-list"></div>
    <button id="gallery-close" class="btn primary">关闭</button>
  </div>
</div>

<div id="modal-free" class="modal hidden">
  <div class="modal-box">
    <h2>☆ 自由模式：创建双星</h2>
    <div class="free-form">
      <label>主星质量 M₁ <output id="out-m1">2.0</output> M☉
        <input type="range" id="free-m1" min="0.3" max="40" step="0.1" value="2"></label>
      <label>伴星质量 M₂ <output id="out-m2">1.0</output> M☉
        <input type="range" id="free-m2" min="0.15" max="40" step="0.05" value="1"></label>
      <label>轨道周期 P <output id="out-p">10.0</output> 天
        <input type="range" id="free-p" min="-1" max="3.5" step="0.01" value="1"></label>
      <label>偏心率 e <output id="out-e">0.10</output>
        <input type="range" id="free-e" min="0" max="0.9" step="0.01" value="0.1"></label>
      <label>轨道倾角 i <output id="out-i">80</output>°
        <input type="range" id="free-i" min="0" max="90" step="1" value="80"></label>
    </div>
    <div id="free-preview" class="kv"></div>
    <div class="modal-actions">
      <button id="free-start" class="btn primary">诞生！</button>
      <button id="free-cancel" class="btn">取消</button>
    </div>
  </div>
</div>

<div id="toast-wrap" class="toast-wrap"></div>

<script src="js/physics.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/levels.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/hrd.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
